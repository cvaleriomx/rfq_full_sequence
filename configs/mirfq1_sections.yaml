output_dir: outputs/mirfq1_sections
beam_diagnostics:
  envelope_multiplier: 1.0  # Multiplier of the native TRANSOPTR envelope.
  envelope_convention: unconfirmed  # Set to rms only after verifying input convention.
  max_occupancy: 1.0
  max_divergence_mrad: null
  max_pair_advance_deg: null
  matched_reference_csv: null
beam:
  initialization: template_twiss
  longitudinal_full_width_deg: 90.0  # Full native ellipsoid width, not RMS/FWHM.
  energy_initial_mev: 0.030
  energy_target_mev: 1.000
  energy_tolerance_mev: 0.010  # 1% accepted for this study
rf:
  vane_voltage_kv: 55.2
  tracking_phase_deg: -90.0
  phi_start_deg: -90.0
  phi_end_deg: -30.0
transoptr:
  runner: optr
  command: /home/cvalerio/work1/transoptr/transoptr-master/runoptr.sh
  template_data: configs/mirfq1_transoptr.dat
iteration:
  max_cells: 220

phase_control:
  enabled: true
  tolerance_deg: 0.15
  max_trials: 12
  field_points_per_cell: 16

sections:
  enabled: true
  scheme: nfsp
  rm_cells: 4
  rm_entrance_aperture_cm: 1.2
  B_rm: 8.0
  B_peak: 12.0
  B_acc: 10.0
  ms_cells_after_rm: 20
  mb_cells: 50
  mba_cells: 25
  sh_cells: 20
  gb_cells: 60
  m_sh: 1.08
  m_acc: 1.8
  phi_acc_deg: -30.0
exit:
  enabled: true
  transition_cells: 1
  transition_length_factor: 0.5
  opening_cells: 3
  final_aperture_cm: rm_entrance  # Follow the RM entrance radius (currently 1.2 cm).
  unmodulated_length_cm: 2.0
  fringe_length_cm: 1.0
